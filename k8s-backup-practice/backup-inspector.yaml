
apiVersion: v1
kind: Pod
metadata:
  name: backup-inspector
  namespace: k8s-backup-practice
spec:
  containers:
    - name: inspector
      image: mongo:8
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: backup-storage
          mountPath: /backup
  volumes:
    - name: backup-storage
      persistentVolumeClaim:
        claimName: backup-pvc
