
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup-cronjob
  namespace: k8s-backup-practice
spec:
  # Every 5 minutes for practice
  schedule: "*/5 * * * *"

  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2

  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          containers:
            - name: backup
              image: mongo:8
              command:
                - sh
                - -c
                - |
                  set -e
                  BACKUP_FILE="/backup/backup-$(date +%Y%m%d-%H%M%S).archive.gz"

                  mongodump \
                    --host=practice-mongo.k8s-backup-practice.svc.cluster.local \
                    --port=27017 \
                    --db=backup_demo \
                    --gzip \
                    --archive="$BACKUP_FILE"

                  echo "Backup saved: $BACKUP_FILE"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
          restartPolicy: Never
