
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-mongo
  namespace: k8s-backup-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: practice-mongo
  template:
    metadata:
      labels:
        app: practice-mongo
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: practice-mongo
  namespace: k8s-backup-practice
spec:
  selector:
    app: practice-mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
