
services:
  frontend:
    build:
      context: ./frontend
    container_name: taskflow-frontend
    ports:
      - "8080:80"
    depends_on:
      - taskflow-backend

  taskflow-backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    environment:
      DB_HOST: postgres
      DB_NAME: taskflow
      DB_USER: taskflow
      DB_PASSWORD: taskflow123
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
