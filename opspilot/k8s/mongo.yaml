apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-mongo
spec:
  selector:
    matchLabels:
      app: opspilot-mongo
  template:
    metadata:
      labels:
        app: opspilot-mongo
    spec:
      containers:
      - name: opspilot-mongo
        image: docker.io/mongo:7
        ports:
        - containerPort: 27017
---

apiVersion: v1
kind: Service
metadata:
  name: opspilot-mongo
spec:
  selector:
    app: opspilot-mongo
  ports:
  - port: 27017
    targetPort: 27017
