
apiVersion: v1
kind: Pod
metadata:
  name: opspilot-dynamic-test
  namespace: opspilot
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: dynamic-storage
          mountPath: /data
  volumes:
    - name: dynamic-storage
      persistentVolumeClaim:
        claimName: opspilot-dynamic-pvc

