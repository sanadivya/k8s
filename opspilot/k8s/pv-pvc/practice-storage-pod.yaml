
apiVersion: v1
kind: Pod
metadata:
  name: opspilot-storage-test
  namespace: opspilot
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: practice-storage
          mountPath: /data
  volumes:
    - name: practice-storage
      persistentVolumeClaim:
        claimName: opspilot-practice-pvc
