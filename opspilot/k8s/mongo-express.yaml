apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-mongo-express
spec:
  selector:
    matchLabels:
      app: opspilot-mongo-express
  replicas: 1
  template:
    metadata:
      labels:
        app: opspilot-mongo-express
    spec:
      containers:
      - name: opspilot-mongo-express
        image: docker.io/mongo-express
        env:
        - name: ME_CONFIG_MONGODB_SERVER
          value: opspilot-mongo.opspilot.svc.cluster.local
        - name: ME_CONFIG_MONGODB_URL
          value: mongodb://opspilot-mongo:27017
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-mongo-express
spec:
  selector:
    app: opspilot-mongo-express
  ports:
  - port: 80  # service port
    targetPort: 8081   # port inside the container

