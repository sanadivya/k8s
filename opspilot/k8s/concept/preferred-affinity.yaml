apiVersion: v1
kind: Pod
metadata:
  name: preferred-affinity
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:                       #Required — must match backend      Preferred — try to match backend
        - weight: 100
          preference:
            matchExpressions:
              - key: workload
                operator: In
                values:
                  - backend
  containers:
    - name: nginx
      image: nginx:stable