apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dniavvyeaen
  labels:
    app.kubernetes.io/name: dniavvyeaen
spec:
  rules:
  - host: <balaji.ml>
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontend
            port: 
              number: 80
  - host: <backend.balaji.ml>
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: backend
            port: 
              number: 80
  - host: <express.balaji.ml>
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: mongo-express
            port: 
              number: 80